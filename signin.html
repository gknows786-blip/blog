<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign in</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body data-page="signin">
	<nav>
		<strong>Simple users</strong>
		<div><a href="index.html">Sign up</a><a href="dashboard.html">Dashboard</a></div>
	</nav>
	<main>
		<p class="intro">Beginner user practice</p>
		<h1>Welcome back</h1>
		<p class="intro">Sign in with an account saved in this browser.</p>
		<section class="panel">
			<form data-signin-form>
				<label>Email <input name="email" type="email" required autocomplete="email"></label>
				<label>Password <input name="password" type="password" required autocomplete="current-password"></label>
				<button type="submit">Sign in</button>
			</form>
			<p class="message" data-message aria-live="polite"></p>
		</section>
	</main>
	<script>
		const storageKey = "simple-users";
		let users = JSON.parse(localStorage.getItem(storageKey)) || [];
		const form = document.querySelector("[data-signin-form]");
		const message = document.querySelector("[data-message]");

		form.addEventListener("submit", function (event) {
			event.preventDefault();

			const email = form.elements.email.value.trim().toLowerCase();
			const password = form.elements.password.value;
			let matchingUser = null;

			for (let i = 0; i < users.length; i++) {
				if (users[i].email === email && users[i].password === password) {
					matchingUser = users[i];
				}
			}

			if (matchingUser === null) {
				message.textContent = "Email or password is incorrect.";
				message.className = "message error";
				return;
			}

			message.textContent = "Signed in successfully. Hello, " + matchingUser.name + "!";
			message.className = "message";
			localStorage.setItem("current-user", JSON.stringify(matchingUser));
			form.reset();
			showLoading(form.querySelector("button"));
			window.location.href = "dashboard.html";
		});

		function showLoading(button) {
			button.textContent = "Loading...";
			button.disabled = true;
		}
	</script>
</body>
</html>
